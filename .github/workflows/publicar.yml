name: Publicar painel Omie

on:
  schedule:
    # A cada 4 h — coleta Omie e atualiza public/dashboard.html
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-painel-3r
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: America/Sao_Paulo
      OMIE_3R_APP_KEY: ${{ secrets.OMIE_3R_APP_KEY }}
      OMIE_3R_APP_SECRET: ${{ secrets.OMIE_3R_APP_SECRET }}
      ESTOQUE3R_CACHE: ${{ github.workspace }}/cache_ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Conferir secrets Omie
        run: |
          if [ -z "$OMIE_3R_APP_KEY" ] || [ -z "$OMIE_3R_APP_SECRET" ]; then
            echo "Configure OMIE_3R_APP_KEY e OMIE_3R_APP_SECRET em Settings → Secrets → Actions"
            exit 1
          fi

      - uses: actions/cache@v4
        with:
          path: cache_ci
          key: estoque3r-cache-${{ github.run_id }}
          restore-keys: |
            estoque3r-cache-

      - name: Gerar dashboard
        run: python scripts/publicar_painel.py

      - name: Publicar HTML no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/dashboard.html
          if git diff --staged --quiet; then
            echo "Sem alteração no painel."
          else
            git commit -m "chore: atualiza painel estoque 3R ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
