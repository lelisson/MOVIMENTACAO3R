name: Publicar painel Omie

on:
  schedule:
    # A cada 5 min: só coleta Omie se (force via ntfy) ou (já passaram 4h).
    - cron: "*/3 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Forçar coleta Omie agora (ignora janela de 4h)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: publicar-painel-3r
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: America/Sao_Paulo
      OMIE_3R_APP_KEY: ${{ secrets.OMIE_3R_APP_KEY }}
      OMIE_3R_APP_SECRET: ${{ secrets.OMIE_3R_APP_SECRET }}
      ESTOQUE3R_CACHE: ${{ github.workspace }}/cache_ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Checar pedido forçado (ntfy)
        id: ntfy
        run: |
          set -e
          OUT=$(python scripts/checar_force_ntfy.py)
          echo "$OUT"
          FORCE=$(echo "$OUT" | awk -F= '/^FORCE=/{print $2; exit}')
          echo "force=${FORCE}" >> "$GITHUB_OUTPUT"

      - name: Decidir se publica
        id: gate
        env:
          FORCE_PUBLISH: ${{ (github.event_name == 'workflow_dispatch' && inputs.force) || steps.ntfy.outputs.force == 'yes' }}
        run: |
          set -e
          # FORCE_PUBLISH pode ser True/true/yes
          if [ "${{ steps.ntfy.outputs.force }}" = "yes" ]; then
            export FORCE_PUBLISH=true
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            export FORCE_PUBLISH=true
          fi
          OUT=$(python scripts/deve_publicar.py)
          echo "$OUT"
          RUN=$(echo "$OUT" | awk -F= '/^RUN=/{print $2; exit}')
          echo "run=${RUN}" >> "$GITHUB_OUTPUT"
          if [ "$RUN" != "yes" ]; then
            echo "Dentro da janela de 4h e sem force — pulando."
          fi

      - name: Conferir secrets Omie
        if: steps.gate.outputs.run == 'yes'
        run: |
          if [ -z "$OMIE_3R_APP_KEY" ] || [ -z "$OMIE_3R_APP_SECRET" ]; then
            echo "Configure OMIE_3R_APP_KEY e OMIE_3R_APP_SECRET em Settings → Secrets → Actions"
            exit 1
          fi

      - uses: actions/cache@v4
        if: steps.gate.outputs.run == 'yes'
        with:
          path: cache_ci
          key: estoque3r-cache-${{ github.run_id }}
          restore-keys: |
            estoque3r-cache-

      - name: Gerar dashboard
        if: steps.gate.outputs.run == 'yes'
        env:
          PUBLISH_SOURCE: ${{ steps.ntfy.outputs.force == 'yes' && 'force' || github.event_name }}
        run: python scripts/publicar_painel.py

      - name: Publicar HTML no repositório
        if: steps.gate.outputs.run == 'yes'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/dashboard.html public/last_publish.json
          if git diff --staged --quiet; then
            echo "Sem alteração no painel."
          else
            git commit -m "chore: atualiza painel estoque 3R ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
